name: Evaluate assistant

on:
  push:
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Behave suite
        run: behave

      - name: Score baseline build (quality gate)
        run: python -m aiqe.evaluate --build baseline --out ci-reports

      - name: Score candidate build (expected to fail; shows regression detection)
        run: python -m aiqe.evaluate --build candidate --compare ci-reports/baseline.json --out ci-reports || true

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: ci-reports/
